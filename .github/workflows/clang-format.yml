name: Format C++ Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Bot Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Clang-Format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-15

      - name: Run Clang-Format
        run: |
          find . -type d \( -name build -o -name .git \) -prune -o \( -name '*.cpp' -o -name '*.hpp' -o -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.hh' -o -name '*.vert' -o -name '*.frag' \) -exec clang-format-15 -i {} +

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format C++ code with clang-format"
          branch: ${{ github.head_ref || github.ref_name }}
          commit_user_name: "tugamer89-release-bot[bot]"
          commit_user_email: "287969055+tugamer89-release-bot[bot]@users.noreply.github.com"
